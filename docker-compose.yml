version: "3.9"

# ─── ProMatrix Infrastructure Services ───────────────────────────────────────
# Runs PostgreSQL 15 and Redis 7 for local development.
# Data is persisted to named Docker volumes so it survives container restarts.

services:
  # ── PostgreSQL 15 ────────────────────────────────────────────────────────
  promatrix_db:
    image: postgres:15-alpine
    container_name: promatrix_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promatrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promatrix_secret}
      POSTGRES_DB: ${POSTGRES_DB:-promatrix}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promatrix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────────────────────────
  promatrix_redis:
    image: redis:7-alpine
    container_name: promatrix_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ─── Named Volumes (local persistence) ───────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
